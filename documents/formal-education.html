<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Formal Education</title>
<style>
:root{
  --bg:#eaf0f4; --surface:#ffffff; --surface-2:#f4f8fb; --ink:#12212e; --muted:#566472;
  --faint:#8593a0; --line:#d8e2ea; --accent:#0e7490; --accent-ink:#0b5563; --accent-soft:#e2f4f8;
  --shadow:0 1px 2px rgba(18,33,46,.05),0 8px 24px rgba(18,33,46,.06);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0a111b; --surface:#131e2b; --surface-2:#0f1926; --ink:#e7eef4; --muted:#94a4b3;
  --faint:#65788a; --line:#22323f; --accent:#22c1d6; --accent-ink:#7fe6f2; --accent-soft:#123039;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
}}
:root[data-theme=dark]{
  --bg:#0a111b; --surface:#131e2b; --surface-2:#0f1926; --ink:#e7eef4; --muted:#94a4b3;
  --faint:#65788a; --line:#22323f; --accent:#22c1d6; --accent-ink:#7fe6f2; --accent-soft:#123039;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:940px;margin:0 auto;padding:0 20px 96px}
.tnum{font-variant-numeric:tabular-nums}
.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar-in{max-width:940px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.brand .nm{font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:.2px}
.brand .sb{font-size:12px;color:var(--muted)}
.count{font-family:var(--serif);font-size:15px;color:var(--accent-ink);white-space:nowrap}
.count b{font-size:22px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:600 13px var(--sans);padding:8px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .15s,border-color .15s,color .15s}
.btn:hover{border-color:var(--accent);color:var(--accent-ink)}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.06);color:#fff}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.filters{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 0 4px}
.search{flex:1;min-width:200px;position:relative}
.search input{width:100%;padding:9px 12px 9px 34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:400 14px var(--sans)}
.search input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--faint);fill:none;stroke-width:2}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:600 12px var(--sans);padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.group{margin-top:30px}
.group-h{display:flex;align-items:baseline;gap:10px;padding-bottom:10px;margin-bottom:8px;border-bottom:2px solid var(--line)}
.group-h h2{font-family:var(--serif);font-size:19px;font-weight:600;margin:0}
.group-h .gc{font-size:12px;color:var(--faint);font-weight:600}
.group-h .gsel{margin-left:auto;font:600 12px var(--sans);color:var(--accent-ink);background:none;border:none;cursor:pointer;padding:4px 6px;border-radius:6px}
.group-h .gsel:hover{background:var(--accent-soft)}
.rows{display:flex;flex-direction:column;gap:8px}
.cred{display:grid;grid-template-columns:22px 1fr;gap:12px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:11px;box-shadow:var(--shadow);cursor:pointer;transition:opacity .15s,border-color .15s,background .15s}
.cred .box{width:20px;height:20px;border-radius:6px;border:2px solid var(--accent);background:var(--accent);display:flex;align-items:center;justify-content:center;margin-top:2px;flex-shrink:0}
.cred .box svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.cred.off{opacity:.5;border-left-color:var(--line);background:var(--surface-2)}
.cred.off .box{background:transparent;border-color:var(--faint)}
.cred.off .box svg{display:none}
.cred.hidden{display:none}
.cred h3{font:650 15px var(--sans);margin:0 0 2px;line-height:1.35}
.cred .inst{font-size:13.5px;color:var(--accent-ink);font-weight:600}
.cred .meta{font-size:12.5px;color:var(--muted);margin-top:2px}
.cred .notes{font-size:12.5px;color:var(--muted);margin-top:7px;line-height:1.5}
.cred .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.tag{font:600 10.5px var(--sans);padding:2px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.tag.geo{color:var(--accent-ink);border-color:var(--accent);background:var(--accent-soft)}
.pos .rlabel{font:700 11px var(--sans);text-transform:uppercase;letter-spacing:.06em;color:var(--accent-ink);margin:11px 0 3px}
.pos ul{margin:0;padding-left:18px}
.pos li{font-size:13px;color:var(--ink);margin:3px 0;line-height:1.5}
.group.hidden{display:none}
.empty{display:none;text-align:center;color:var(--faint);padding:40px;font-size:14px}
.print-head{display:none}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;transition:opacity .2s,transform .2s;z-index:50;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.foot{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--faint);text-align:center}
@media (max-width:560px){.brand{margin-right:0;width:100%}.count{order:3}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .bar,.filters,.foot,.cred .box,.group-h .gsel,.toast{display:none!important}
  .wrap{max-width:none;padding:0}
  .cred.off,.cred.hidden{display:none!important}
  .group:has(.rows:not(:has(.cred:not(.off):not(.hidden)))){display:none}
  .cred{grid-template-columns:1fr;break-inside:avoid;box-shadow:none;border:none;border-left:2px solid var(--accent);border-radius:0;padding:8px 0 8px 12px;margin:0}
  .rows{gap:12px}
  .group{margin-top:18px}
  .tag{border-color:#bbb}
  .print-head{display:block;margin-bottom:8px;padding-bottom:14px;border-bottom:2px solid var(--ink)}
  .print-head .pn{font-family:var(--serif);font-size:26px;font-weight:700;margin:0}
  .print-head .pt{font-size:13px;color:#333;margin:3px 0 0}
  .print-head .pc{font-size:12px;color:#333;margin:8px 0 0}
  @page{margin:16mm}
}
</style>
</head>

 Salvador"],"topics":["Electrical & Electronics"]},{"id":"primary","title":"Primary and Junior High Education (Grades 1–9)","institution":"Unified School Pbro. Leopoldo Nuñez (1st-6th grade), Salesian Institution Ciudad de los Niños (7th-9th grade)","location":"Santa Ana, El Salvador","year":1999,"date":"1991-1999","duration":null,"notes":"Ministry of Education. Primary (Grades 1–6) and Junior High (Grades 7–9).","geo":["El Salvador"],"topics":[]}]}],"suggestedExclude":[]};(function(){var f=(function clientApp() {

  function effDark() {

  var sunSvg = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/></svg>';
  var moonSvg = '<svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>';
  function updateThemeBtn() { var b = document.getElementById('themeBtn'); if (b) b.innerHTML = effDark() ? sunSvg : moonSvg; }

  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };

  function credCardHtml(c, gkey) {

    h += '<div><h3>' + esc(c.title) + '</h3><div class="inst">' + esc(c.institution) + '</div><div class="meta tnum">' + esc(metaLine(c)) + '</div>';

  }

  }

  if (M.suggestedExclude && M.suggestedExclude.length) html += '<button class="btn" data-act="suggest">Suggested</button>';
  html += '<button class="btn" data-act="copy"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>Copy Markdown</button>';

  html += '<button class="btn primary" data-act="print"><svg viewBox="0 0 24 24"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>Save as PDF</button>';
  html += '</div></div></div>';

  html += '<div class="wrap">';
  html += '<div class="print-head"><p class="pn">' + esc(M.profile.shortName) + '</p>';
  if (contactLine) html += '<p class="pc">' + esc(contactLine) + '</p>';
  html += '</div>';

  html += '<div class="filters"><div class="search"><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><input id="q" type="search" placeholder="Search…" autocomplete="off"></div><div class="chips" id="chips"></div></div>';

  if (isExp) {

  } else {

  var cards = Array.prototype.slice.call(document.querySelectorAll('.cred'));

  }

  function docStyle(P) {
    return '@page{margin:' + P.pageMargin + '}*{box-sizing:border-box}'
      + 'html,body{background:' + P.bg + '}'
      + 'body{font-family:Georgia,"Iowan Old Style",serif;color:' + P.ink + ';margin:0 auto;padding:' + P.pad + ';max-width:820px;line-height:1.5;-webkit-print-color-adjust:exact;print-color-adjust:exact}'
      + '.h{border-bottom:2px solid ' + P.ink + ';padding-bottom:12px;margin-bottom:16px}'
      + '.h .n{font-size:26px;font-weight:700;margin:0}.h .s{font-size:13px;color:' + P.mut + ';margin:4px 0 0}.h .c{font-size:12px;color:' + P.mut + ';margin:8px 0 0}'
      + 'h2{font-size:17px;border-bottom:1px solid ' + P.line + ';padding-bottom:4px;margin:22px 0 10px}'
      + '.it{margin:0 0 13px;padding-left:12px;border-left:2px solid ' + P.acc + ';break-inside:avoid}'
      + '.it .t{font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:14px}'
      + '.it .in{font-size:13px;color:' + P.accink + ';font-weight:600}.it .m{font-size:12px;color:' + P.mut + '}.it .no{font-size:12px;color:' + P.mut + ';margin-top:4px}'
      + '.it ul{margin:4px 0;padding-left:18px}.it li{font-size:12.5px;margin:2px 0}'
      + '.rl{font-family:Arial,Helvetica,sans-serif;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:' + P.accink + ';margin:7px 0 2px}'
      + '.tags{margin-top:5px}.tag{display:inline-block;font-family:Arial,Helvetica,sans-serif;font-size:10px;border:1px solid ' + P.tagb + ';border-radius:10px;padding:1px 7px;margin:2px 4px 0 0;color:' + P.mut + '}'
      + '.ft{margin-top:22px;border-top:1px solid ' + P.line + ';padding-top:8px;font-size:11px;color:' + P.mut + '}';
  }

  function buildStandaloneDoc() {
    var P = effDark()
      ? { bg: '#0f1826', ink: '#e7eef4', mut: '#aebccb', acc: '#22c1d6', accink: '#7fe6f2', line: '#2a3a49', tagb: '#3a4a59', pageMargin: '0', pad: '16mm' }
      : { bg: '#ffffff', ink: '#111111', mut: '#333333', acc: '#0e7490', accink: '#0b5563', line: '#cccccc', tagb: '#bbbbbb', pageMargin: '16mm', pad: '24px' };
    var b = '<div class="h"><p class="n">' + esc(M.profile.shortName) + '</p>';
    if (contactLine) b += '<p class="c">' + esc(contactLine) + '</p>';
    b += '</div>';
    if (isExp) {
      M.positions.filter(function (p) { return !excluded.has(p.id); }).forEach(function (p) {
        b += '<div class="it"><div class="t">' + esc(p.title) + '</div><div class="in">' + esc(p.company) + '</div><div class="m">' + esc(p.startDate + ' – ' + p.endDate + ' · ' + p.location) + '</div>';
        if (p.responsibilities.length) b += '<div class="rl">Responsibilities</div><ul>' + p.responsibilities.map(function (r) { return '<li>' + esc(r) + '</li>'; }).join('') + '</ul>';
        if (p.achievements.length) b += '<div class="rl">Achievements</div><ul>' + p.achievements.map(function (a) { return '<li>' + esc(a) + '</li>'; }).join('') + '</ul>';
        b += '</div>';
      });
    } else {
      M.groups.forEach(function (g) {
        var its = g.items.filter(function (c) { return !excluded.has(c.id); });
        if (!its.length) return;
        b += '<h2>' + esc(g.label) + '</h2>';
        its.forEach(function (c) {
          b += '<div class="it"><div class="t">' + esc(c.title) + '</div><div class="in">' + esc(c.institution) + '</div><div class="m">' + esc(metaLine(c)) + '</div>';
          if (c.notes) b += '<div class="no">' + esc(c.notes) + '</div>';
          var tags = c.geo.concat(c.topics);
          if (tags.length) b += '<div class="tags">' + tags.map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('') + '</div>';
          b += '</div>';
        });
      });
    }
    b += '<div class="ft">' + esc(M.profile.shortName) + ' · ' + esc(M.docTitle) + ' · ' + (M.total - excluded.size) + ' of ' + M.total + ' selected</div>';
    return '<!doctype html><html lang="en"><head><meta charset="utf-8"><title>' + esc(M.profile.shortName + ' — ' + M.docTitle) + '</title><style>' + docStyle(P) + '</style></head><body onload="setTimeout(function(){window.print();},400)">' + b + '</body></html>';
  }

  function saveAsPdf() {
    if (M.total - excluded.size === 0) { toast('Nothing selected to export'); return; }
    var docHtml = buildStandaloneDoc();
    var w = null;
    try { w = window.open('', '_blank'); } catch (e) { w = null; }
    if (w && w.document) {
      w.document.open();
      w.document.write(docHtml);
      w.document.close();
      try { w.focus(); } catch (e) {}
      toast('A print dialog opens in the new tab — set destination to "Save as PDF"');
      return;
    }
    // No pop-up (blocked, or a file:// quirk): print this page directly (uses the print stylesheet).
    try { window.print(); return; } catch (e) {}
    // Last resort: download a print-ready .html that auto-opens the print dialog.
    try {
      var blob = new Blob([docHtml], { type: 'text/html' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = M.docTitle.replace(/[^a-z0-9]+/gi, '-').toLowerCase() + '.html';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
      toast('Downloaded an .html file — open it; it shows Save as PDF automatically');
    } catch (e) {
      toast('Blocked here — use Copy Markdown instead');
    }
  }

  var toastEl = document.getElementById('toast'); var toastT;
  function toast(msg) { toastEl.textContent = msg; toastEl.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(function () { toastEl.classList.remove('show'); }, 2400); }

  apply();
});if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",f);}else{f();}})();</script>
</body>
